name: Spring Boot Starter Test

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

permissions:
  contents: read

jobs:
  spring-boot-starter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # spring-boot-starter targets Java 17/Spring Boot 4.x, unlike the core
      # library (Java 8). One JDK 17 setup covers both: javac is backward
      # compatible with an older -source/-target, so it builds the core
      # library's own -source/-target 8 code without issue, then the
      # starter itself at its native Java 17 level.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # spring-boot-starter is now a real sibling reactor module of core/
      # (both share a parent POM and version) - -am builds core first since
      # the starter depends on it, all resolved within this one reactor
      # session. No local install/version-detection dance needed, unlike
      # the standalone samples/* projects below.
      - name: Build and test the Spring Boot starter
        run: mvn -B test -pl spring-boot-starter -am

  # samples/spring-boot-consumer (step 8 of
  # docs/design/spring-boot-starter.md's rollout plan) - a real, separate
  # downstream project depending on both the core library and the starter
  # as ordinary Maven dependencies, the same way samples/compile-time-proxy-consumer
  # does for compile-time proxy generation. A separate job (not folded into
  # spring-boot-starter above) so a regression here is reported distinctly
  # from a failure in the starter's own unit tests.
  sample-spring-boot-consumer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Unlike the reactor-internal build above, this sample resolves core
      # and the starter as ordinary external Maven dependencies (mirroring
      # a real downstream consumer), so both need actually installing to
      # the runner's local repo - along with the parent POM (-N, non-
      # recursive) both of their published POMs reference.
      - name: Install the parent POM locally
        run: mvn -B install -N
      - name: Install core and the Spring Boot starter locally
        run: mvn -B install -DskipTests -pl core,spring-boot-starter

      # core and spring-boot-starter always share one version now (both
      # inherit it from the parent) - read it once from pom.xml, anchored
      # on the rest-in-peace-parent artifactId in case plugin versions
      # elsewhere in the file shift which <version> comes first.
      - name: Determine the installed version
        id: rip-version
        run: echo "version=$(grep -A1 -F '<artifactId>rest-in-peace-parent</artifactId>' pom.xml | grep -oP '(?<=<version>)[^<]+(?=</version>)')" >> "$GITHUB_OUTPUT"

      - name: Build and run the sample consumer
        working-directory: samples/spring-boot-consumer
        run: |
          mvn -B compile dependency:build-classpath -Dmdep.outputFile=cp.txt \
            -Drest-in-peace.version=${{ steps.rip-version.outputs.version }} \
            -Drest-in-peace-spring-boot-starter.version=${{ steps.rip-version.outputs.version }}
          java -cp "target/classes:src/main/resources:$(cat cp.txt)" com.example.consumer.Main
