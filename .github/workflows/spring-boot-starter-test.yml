name: Spring Boot Starter Test

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

permissions:
  contents: read

jobs:
  spring-boot-starter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # spring-boot-starter targets Java 17/Spring Boot 4.x, unlike the core
      # library (Java 8). One JDK 17 setup covers both steps below: javac is
      # backward compatible with an older -source/-target, so it installs
      # the core library's own -source/-target 8 code without issue, then
      # builds/tests the starter itself at its native Java 17 level.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # spring-boot-starter is a standalone Maven project, not a module of
      # this one - it needs the core library actually installed to the
      # runner's local repo to resolve it, mirroring exactly what a real
      # downstream consumer's own build would see once the library is
      # published, except from a fresh local install of the current commit
      # instead of a released version.
      - name: Install the core library locally
        run: mvn -B install -DskipTests --file pom.xml

      # The starter's own pom.xml pins a default rest-in-peace.version for
      # convenience, but that default drifts the moment this branch's
      # version differs from whatever was just installed above - so always
      # resolve the version that was actually just installed instead of
      # trusting the default.
      - name: Determine the installed core library version
        id: rip-version
        run: echo "version=$(grep -m1 -oP '(?<=<version>)[^<]+(?=</version>)' pom.xml)" >> "$GITHUB_OUTPUT"

      - name: Build and test the Spring Boot starter
        working-directory: spring-boot-starter
        run: mvn -B test -Drest-in-peace.version=${{ steps.rip-version.outputs.version }}
