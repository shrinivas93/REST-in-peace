name: Spring Boot Starter Test

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

permissions:
  contents: read

jobs:
  spring-boot-starter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # spring-boot-starter targets Java 17/Spring Boot 4.x, unlike the core
      # library (Java 8). One JDK 17 setup covers both steps below: javac is
      # backward compatible with an older -source/-target, so it installs
      # the core library's own -source/-target 8 code without issue, then
      # builds/tests the starter itself at its native Java 17 level.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # spring-boot-starter is a standalone Maven project, not a module of
      # this one - it needs the core library actually installed to the
      # runner's local repo to resolve it, mirroring exactly what a real
      # downstream consumer's own build would see once the library is
      # published, except from a fresh local install of the current commit
      # instead of a released version.
      # core/ is the actual rest-in-peace artifact - the repo root pom.xml
      # is just a reactor aggregator with no distributionManagement of its
      # own.
      - name: Install the core library locally
        run: mvn -B install -DskipTests --file core/pom.xml

      # The starter's own pom.xml pins a default rest-in-peace.version for
      # convenience, but that default drifts the moment this branch's
      # version differs from whatever was just installed above - so always
      # resolve the version that was actually just installed instead of
      # trusting the default.
      # core/pom.xml has a <parent> block whose own <version> tag comes
      # first in the file, so a plain first-match grep would pick that up
      # instead of the artifact's own version - anchor on the
      # rest-in-peace artifactId (not rest-in-peace-parent) instead.
      - name: Determine the installed core library version
        id: rip-version
        run: echo "version=$(grep -A1 -F '<artifactId>rest-in-peace</artifactId>' core/pom.xml | grep -oP '(?<=<version>)[^<]+(?=</version>)')" >> "$GITHUB_OUTPUT"

      - name: Build and test the Spring Boot starter
        working-directory: spring-boot-starter
        run: mvn -B test -Drest-in-peace.version=${{ steps.rip-version.outputs.version }}

  # samples/spring-boot-consumer (step 8 of
  # docs/design/spring-boot-starter.md's rollout plan) - a real, separate
  # downstream project depending on both the core library and the starter
  # as ordinary Maven dependencies, the same way samples/compile-time-proxy-consumer
  # does for compile-time proxy generation. A separate job (not folded into
  # spring-boot-starter above) so a regression here is reported distinctly
  # from a failure in the starter's own unit tests.
  sample-spring-boot-consumer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # core/ is the actual rest-in-peace artifact - the repo root pom.xml
      # is just a reactor aggregator with no distributionManagement of its
      # own.
      - name: Install the core library locally
        run: mvn -B install -DskipTests --file core/pom.xml

      # core/pom.xml has a <parent> block whose own <version> tag comes
      # first in the file, so a plain first-match grep would pick that up
      # instead of the artifact's own version - anchor on the
      # rest-in-peace artifactId (not rest-in-peace-parent) instead.
      - name: Determine the installed core library version
        id: rip-version
        run: echo "version=$(grep -A1 -F '<artifactId>rest-in-peace</artifactId>' core/pom.xml | grep -oP '(?<=<version>)[^<]+(?=</version>)')" >> "$GITHUB_OUTPUT"

      - name: Install the Spring Boot starter locally
        working-directory: spring-boot-starter
        run: mvn -B install -DskipTests -Drest-in-peace.version=${{ steps.rip-version.outputs.version }}

      # The starter's own pom.xml pins a default rest-in-peace-spring-boot-starter.version
      # for convenience, but - same reasoning as rip-version above - that
      # default drifts the moment this branch's version differs from
      # whatever was just installed.
      - name: Determine the installed starter version
        id: starter-version
        run: echo "version=$(grep -m1 -oP '(?<=<version>)[^<]+(?=</version>)' spring-boot-starter/pom.xml)" >> "$GITHUB_OUTPUT"

      - name: Build and run the sample consumer
        working-directory: samples/spring-boot-consumer
        run: |
          mvn -B compile dependency:build-classpath -Dmdep.outputFile=cp.txt \
            -Drest-in-peace.version=${{ steps.rip-version.outputs.version }} \
            -Drest-in-peace-spring-boot-starter.version=${{ steps.starter-version.outputs.version }}
          java -cp "target/classes:src/main/resources:$(cat cp.txt)" com.example.consumer.Main
