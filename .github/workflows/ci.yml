name: CI

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

permissions:
  contents: read

# Cancels a stale run for the same branch/PR the moment a newer commit lands,
# instead of letting every push's run race to completion independently -
# without this, three quick pushes to one PR burn three full runs' worth of
# minutes even though only the last one's result ever matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung `mvn test` (e.g. a deadlocked test) would otherwise run until
    # GitHub's 6-hour default job cap before failing.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      # Scoped to core specifically: the reactor also includes
      # spring-boot-starter, which targets Java 17 and won't build under
      # this job's JDK 8.
      - name: Run tests
        run: mvn -B test -pl core

      # jacoco-maven-plugin (configured in the root pom.xml, inherited by
      # every module) generates this as part of the ordinary test phase -
      # uploaded here as a plain build artifact too, so the raw report is
      # still inspectable even if the Codecov upload below ever fails.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report-core
          path: core/target/site/jacoco/
          if-no-files-found: ignore

      # Feeds the same jacoco.xml to Codecov for the badge/PR-diff-coverage/
      # trend layer plain artifact upload above doesn't provide. `flags: core`
      # keeps this distinct from spring-boot-starter's own upload in the
      # Codecov UI. CODECOV_TOKEN is a repo secret (Settings -> Secrets and
      # variables -> Actions) - not needed for a public repo's tokenless
      # upload, but used here for the more reliable/full-featured path.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/target/site/jacoco/jacoco.xml
          flags: core
          fail_ci_if_error: false
          verbose: true

  sample-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 8
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # samples/compile-time-proxy-consumer is a standalone Maven project,
      # not a module of this one - it needs the library actually installed
      # to the runner's local repo to resolve it, mirroring exactly what a
      # real downstream consumer's own build would see once the library is
      # published, except from a fresh local install of the current commit
      # instead of a released version. core and spring-boot-starter share a
      # parent POM now (pom.xml) - core's own published POM references it,
      # so the parent needs installing too (-N, non-recursive: just this
      # one POM) before core itself (-pl core, never touching the Java
      # 17-only spring-boot-starter module under this job's JDK 8).
      - name: Install the parent POM locally
        run: mvn -B install -N
      - name: Install the core library locally
        run: mvn -B install -DskipTests -pl core

      # The sample's own pom.xml pins a default rest-in-peace.version for
      # convenience, but that default drifts the moment this branch's
      # version differs from whatever was just installed above (e.g. a
      # release PR merging develop, whose version predates master's
      # post-release bump, into master) - so always resolve the version
      # that was actually just installed instead of trusting the default.
      # core no longer declares its own <version> (inherited from the
      # parent), so read it from the one place it's actually declared -
      # anchored on the rest-in-peace-parent artifactId in case plugin
      # versions elsewhere in the file shift which <version> comes first.
      - name: Determine the installed library version
        id: rip-version
        run: echo "version=$(grep -A1 -F '<artifactId>rest-in-peace-parent</artifactId>' pom.xml | grep -oP '(?<=<version>)[^<]+(?=</version>)')" >> "$GITHUB_OUTPUT"

      - name: Build and run the sample consumer
        working-directory: samples/compile-time-proxy-consumer
        run: |
          mvn -B compile dependency:build-classpath -Dmdep.outputFile=cp.txt \
            -Drest-in-peace.version=${{ steps.rip-version.outputs.version }}
          java -cp "target/classes:$(cat cp.txt)" com.example.consumer.Main

  # The native-image smoke test (step 3 of
  # docs/design/compile-time-proxy-generation.md's rollout plan) - the
  # concrete, checkable proof that RIP.getClient(ItemApi.class)'s
  # compile-time-generated path is genuinely reflection-free under
  # GraalVM's closed-world analysis, not just an assumption. A separate job
  # (not a step added to sample-consumer above) so a native-image failure
  # is reported distinctly from the plain-JVM sample-consumer job, and so
  # this job's GraalVM JDK doesn't affect that one's JDK 8 setup.
  native-image-smoke-test:
    runs-on: ubuntu-latest
    # native-image ahead-of-time compilation is meaningfully slower than a
    # plain JVM build; the other jobs' 15 minutes isn't enough headroom here.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GraalVM's bundled JDK compiles this project's -source/-target 8
      # code just fine (it's simply reading older, always-forward-compatible
      # bytecode instructions) - so one JDK setup covers both installing
      # the library and building the native executable, instead of juggling
      # two JDKs across the job.
      #
      # Bumped from '21' to '25': native-maven-plugin 1.1.12's own default
      # reachability-metadata schema (and every schema-file-count-compatible
      # release near it - see git history on this file/the sample's pom.xml
      # for the version-hunt across GraalVM 21) needs a GraalVM this new to
      # parse at all. GraalVM 25's javac also tightened implicit
      # (classpath-only, no -processor/annotationProcessorPaths) annotation
      # processor discovery enough that it silently stopped activating
      # RestClientProcessor here - see the sample's own pom.xml comment on
      # the native profile's explicit <annotationProcessors>, which works
      # around that without touching the plain, non-native build the
      # sample-consumer job (above) uses to demonstrate the processor's
      # actual zero-config auto-activation.
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      # See the sample-consumer job above for why this is two steps: core's
      # published POM references the shared parent POM (pom.xml), so it
      # needs installing first, non-recursively (-N), before core itself
      # (-pl core, never touching the spring-boot-starter module).
      - name: Install the parent POM locally
        run: mvn -B install -N
      - name: Install the core library locally
        run: mvn -B install -DskipTests -pl core

      # core no longer declares its own <version> (inherited from the
      # parent) - read it from pom.xml instead, anchored on the
      # rest-in-peace-parent artifactId in case plugin versions elsewhere
      # in the file shift which <version> comes first.
      - name: Determine the installed library version
        id: rip-version
        run: echo "version=$(grep -A1 -F '<artifactId>rest-in-peace-parent</artifactId>' pom.xml | grep -oP '(?<=<version>)[^<]+(?=</version>)')" >> "$GITHUB_OUTPUT"

      # NativeMain - not Main - is this build's entry point: it exercises
      # only the fully-covered ItemApi path, deliberately leaving out
      # Main's UnsupportedApi fallback demonstration, which needs its own
      # hand-written proxy-config.json under native-image and would muddy
      # what this smoke test is proving. No reflect-config.json is
      # hand-written anywhere in this project - the one RestClientProcessor
      # itself emits alongside ItemApi_RipImpl is the only config involved.
      - name: Build the native executable
        working-directory: samples/compile-time-proxy-consumer
        run: |
          mvn -B -Pnative package -Drest-in-peace.version=${{ steps.rip-version.outputs.version }}

      - name: Run the native executable
        working-directory: samples/compile-time-proxy-consumer
        run: timeout 30 ./target/compile-time-proxy-consumer

  spring-boot-starter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # spring-boot-starter targets Java 17/Spring Boot 4.x, unlike the core
      # library (Java 8). One JDK 17 setup covers both: javac is backward
      # compatible with an older -source/-target, so it builds the core
      # library's own -source/-target 8 code without issue, then the
      # starter itself at its native Java 17 level.
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # spring-boot-starter is now a real sibling reactor module of core/
      # (both share a parent POM and version) - -am builds core first since
      # the starter depends on it, all resolved within this one reactor
      # session. No local install/version-detection dance needed, unlike
      # the standalone samples/* projects below.
      - name: Build and test the Spring Boot starter
        run: mvn -B test -pl spring-boot-starter -am

      # See the test job above for why - same jacoco-maven-plugin config,
      # inherited from the root pom.xml, applies to this module too.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report-spring-boot-starter
          path: spring-boot-starter/target/site/jacoco/
          if-no-files-found: ignore

      # See the test job above for why. flags: spring-boot-starter keeps
      # this distinct from core's own upload in the Codecov UI.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: spring-boot-starter/target/site/jacoco/jacoco.xml
          flags: spring-boot-starter
          fail_ci_if_error: false
          verbose: true

  # samples/spring-boot-consumer (step 8 of
  # docs/design/spring-boot-starter.md's rollout plan) - a real, separate
  # downstream project depending on both the core library and the starter
  # as ordinary Maven dependencies, the same way samples/compile-time-proxy-consumer
  # does for compile-time proxy generation. A separate job (not folded into
  # spring-boot-starter above) so a regression here is reported distinctly
  # from a failure in the starter's own unit tests.
  sample-spring-boot-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Unlike the reactor-internal build above, this sample resolves core
      # and the starter as ordinary external Maven dependencies (mirroring
      # a real downstream consumer), so both need actually installing to
      # the runner's local repo - along with the parent POM (-N, non-
      # recursive) both of their published POMs reference.
      - name: Install the parent POM locally
        run: mvn -B install -N
      - name: Install core and the Spring Boot starter locally
        run: mvn -B install -DskipTests -pl core,spring-boot-starter

      # core and spring-boot-starter always share one version now (both
      # inherit it from the parent) - read it once from pom.xml, anchored
      # on the rest-in-peace-parent artifactId in case plugin versions
      # elsewhere in the file shift which <version> comes first.
      - name: Determine the installed version
        id: rip-version
        run: echo "version=$(grep -A1 -F '<artifactId>rest-in-peace-parent</artifactId>' pom.xml | grep -oP '(?<=<version>)[^<]+(?=</version>)')" >> "$GITHUB_OUTPUT"

      - name: Build and run the sample consumer
        working-directory: samples/spring-boot-consumer
        run: |
          mvn -B compile dependency:build-classpath -Dmdep.outputFile=cp.txt \
            -Drest-in-peace.version=${{ steps.rip-version.outputs.version }} \
            -Drest-in-peace-spring-boot-starter.version=${{ steps.rip-version.outputs.version }}
          java -cp "target/classes:src/main/resources:$(cat cp.txt)" com.example.consumer.Main
