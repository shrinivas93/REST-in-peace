name: CI

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      # Scoped to core specifically: the reactor also includes
      # spring-boot-starter, which targets Java 17 and won't build under
      # this job's JDK 8.
      - name: Run tests
        run: mvn -B test -pl core
