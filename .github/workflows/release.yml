name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version to release (blank = current version with -SNAPSHOT stripped)'
        required: false
      developmentVersion:
        description: 'Next development version (blank = auto-incremented -SNAPSHOT)'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      # spring-boot-starter targets Java 17 and is now part of this reactor
      # (release:prepare's default preparationGoals build+test everything),
      # so this needs a JDK new enough for it - which also compiles core's
      # own -source/-target 8 code without issue.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Run from the repo root, covering the whole reactor: core and
      # spring-boot-starter share one version via their common parent
      # (pom.xml), so autoVersionSubmodules (configured there) bumps both
      # together in one release:prepare run - no per-module release process
      # anymore.
      - name: Prepare release
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
          DEV_VERSION: ${{ github.event.inputs.developmentVersion }}
        run: |
          ARGS=()
          if [ -n "$RELEASE_VERSION" ]; then
            ARGS+=("-DreleaseVersion=$RELEASE_VERSION")
          fi
          if [ -n "$DEV_VERSION" ]; then
            ARGS+=("-DdevelopmentVersion=$DEV_VERSION")
          fi
          mvn -B release:prepare "${ARGS[@]}"

      - name: Determine released tag
        id: released_tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.released_tag.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"

      # A release created via the default GITHUB_TOKEN does not fire other
      # workflows' `on: release` triggers (GitHub's anti-recursion rule), so
      # maven-publish.yml would never run on its own - dispatch it explicitly.
      - name: Trigger publish workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.released_tag.outputs.tag }}
        run: gh workflow run maven-publish.yml --ref "$RELEASE_TAG"

      # Dispatched against master (not the release tag) because the
      # github-pages deployment environment's branch/tag protection rule
      # only allows master, not tags - the release tag is instead passed as
      # the "ref" input so the job checks out and builds the exact released
      # commit, not master's post-release "prepare for next development
      # iteration" -SNAPSHOT bump.
      - name: Trigger javadoc workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.released_tag.outputs.tag }}
        run: gh workflow run javadoc.yml --ref master -f ref="$RELEASE_TAG"

      # "Prepare release" above pushed two new commits directly to master
      # (the version bump + tag, then the next-dev-snapshot bump) - nothing
      # else ever brings those back down to develop, which is exactly how
      # the two branches drift apart, release after release, with nobody
      # noticing until it's a large, awkward merge. Merge master back into
      # develop immediately, in this same run, so they can never diverge
      # this way again. A real conflict here (extremely unlikely for a pure
      # version-bump commit) fails this step loudly for a maintainer to
      # resolve by hand - never auto-resolved or force-pushed.
      - name: Sync master back into develop
        run: |
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge origin/master --no-edit
          git push origin develop
