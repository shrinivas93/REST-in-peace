# This workflow builds the reactor (parent POM, core, and
# spring-boot-starter) using Maven and then publishes all three to GitHub
# Packages - core and spring-boot-starter share one version via their common
# parent, so they're released and published together, not separately. It
# also publishes the same three artifacts to Maven Central, as a separate
# `mvn deploy -Pcentral` invocation against its own settings.xml (see that
# step's own comment for why it's kept fully separate from the GitHub
# Packages deploy above it, rather than one shared settings.xml/deploy).
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path
#
# Dispatch-only by design, not `on: release` - a release created via
# release.yml's own GITHUB_TOKEN wouldn't fire that trigger anyway (GitHub's
# anti-recursion rule), so release.yml always dispatches this explicitly
# against the release tag once the GitHub release itself is created. An
# `on: release` trigger here would only matter for a release made by hand
# outside release.yml, which isn't a supported path - keeping this
# dispatch-only avoids a trigger that looks automatic but in practice never
# fires the way a reader would expect.

name: Maven Package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    # spring-boot-starter targets Java 17; one JDK 17 setup builds/publishes
    # the whole reactor (parent POM, core, and the starter) since javac
    # compiles core's own -source/-target 8 code fine on a newer JDK too.
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field, inherited by every module from pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    # Builds and deploys the whole reactor: the parent POM itself (needed
    # since core and spring-boot-starter's own published POMs reference it),
    # core, and spring-boot-starter - all three share one version and one
    # release.
    - name: Build with Maven
      run: mvn -B package

    - name: Publish to GitHub Packages Apache Maven
      run: mvn deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}

    # A second, independent JDK/settings.xml setup, writing to a different
    # path than the step above's $GITHUB_WORKSPACE/settings.xml - a second
    # setup-java call at the same path would just overwrite that file's
    # <server> entry (github) with this one's (central), losing whichever
    # ran first. gpg-private-key/gpg-passphrase import the signing key and
    # wire GPG_PASSPHRASE for maven-gpg-plugin to pick up (see the -Dgpg.
    # passphrase reference on the deploy step below); server-id/username/
    # password populate the <server id="central"> entry the central profile
    # (pom.xml) publishes with, matching its own publishingServerId.
    - name: Set up JDK 17 for Maven Central credentials
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: central
        server-username: CENTRAL_TOKEN_USERNAME
        server-password: CENTRAL_TOKEN_PASSWORD
        settings-path: ${{ github.workspace }}/central-settings
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    # See pom.xml's own comment on the `central` profile: its
    # central-publishing-maven-plugin uploads a signed bundle to the Central
    # Portal's Publisher API instead of a plain repository PUT, so this is a
    # full, separate `mvn deploy` invocation rather than sharing the GitHub
    # Packages one above. autoPublish=true in that profile means a validated
    # bundle goes live on Central immediately - every tagged release publishes
    # automatically, with no manual step in the Portal UI.
    - name: Publish to Maven Central
      run: mvn -B deploy -Pcentral -s $GITHUB_WORKSPACE/central-settings/settings.xml -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
      env:
        CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
