# This workflow will build the reactor (parent POM, core, and
# spring-boot-starter) using Maven and then publish all three to GitHub
# Packages when a release is created - core and spring-boot-starter share
# one version via their common parent, so they're released and published
# together, not separately.
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path

name: Maven Package

on:
  release:
    types: [created]
  # release.yml creates the GitHub release with the default GITHUB_TOKEN,
  # which doesn't fire `on: release` here (GitHub's anti-recursion rule), so
  # it dispatches this workflow explicitly instead - workflow_dispatch is
  # exempt from that restriction.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    # spring-boot-starter targets Java 17; one JDK 17 setup builds/publishes
    # the whole reactor (parent POM, core, and the starter) since javac
    # compiles core's own -source/-target 8 code fine on a newer JDK too.
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field, inherited by every module from pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    # Builds and deploys the whole reactor: the parent POM itself (needed
    # since core and spring-boot-starter's own published POMs reference it),
    # core, and spring-boot-starter - all three share one version and one
    # release.
    - name: Build with Maven
      run: mvn -B package

    - name: Publish to GitHub Packages Apache Maven
      run: mvn deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}
