name: Publish Site

# Publishes the project's GitHub Pages site: docs/getting-started.html (the
# field guide - every feature, plain Java and the Spring Boot starter side
# by side) as the site root, with the generated Javadoc underneath it at
# /apidocs/. Kept as one workflow/one deployment rather than two, since
# GitHub Pages serves exactly one artifact per environment - the getting-
# started page links to /apidocs/ for the full API surface.
#
# Filename kept as javadoc.yml (not renamed) since release.yml dispatches
# it by filename (`gh workflow run javadoc.yml`) - only this display name
# and what it builds have grown.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag or commit) to build the site from (blank = the ref this workflow runs on)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      # spring-boot-starter targets Java 17; one JDK 17 setup generates
      # Javadoc for both modules since javac reads core's own
      # -source/-target 8 code fine on a newer JDK too.
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      # Directly invoking a plugin goal (rather than a lifecycle phase)
      # doesn't build reactor dependencies first, so spring-boot-starter
      # can't otherwise resolve core - install the reactor once so both
      # modules' javadoc:javadoc runs below have what they need.
      - name: Install the reactor
        run: mvn -B install -DskipTests
      # The repo root pom.xml is just a reactor aggregator with no javadoc
      # plugin config of its own - core and spring-boot-starter each
      # declare it themselves and get built (and their docs published)
      # separately.
      - name: Generate Javadoc
        run: mvn -B javadoc:javadoc -pl core,spring-boot-starter
      - name: Assemble site
        run: |
          mkdir -p target/site/spring-boot-starter
          cp docs/getting-started.html target/site/index.html

          # Stamps the field guide with the exact version it was built from
          # and today's date, so a reader can tell at a glance whether it's
          # in sync with the latest release without diffing the page against
          # the repo by hand. docs/getting-started.html itself keeps the
          # __RIP_VERSION__/__RIP_BUILD_DATE__ placeholders in source control -
          # only the published copy under target/site/ is stamped, here,
          # right after it's copied. core no longer declares its own
          # <version> (inherited from the parent) - read it from pom.xml,
          # anchored on the rest-in-peace-parent artifactId in case plugin
          # versions elsewhere in the file shift which <version> comes
          # first. Prefixed with "v" to match maven-release-plugin's own
          # tagNameFormat (v@{project.version}) - when this workflow is
          # dispatched against a release tag (as release.yml always does),
          # pom.xml's version at that exact commit is already the released,
          # non-SNAPSHOT one, so this reads back as identical to the tag
          # itself. A manual dispatch against a branch instead shows its
          # real -SNAPSHOT version, honestly labeling it as an unreleased
          # preview rather than implying a real release.
          RIP_VERSION="v$(grep -A1 -F '<artifactId>rest-in-peace-parent</artifactId>' pom.xml | grep -oP '(?<=<version>)[^<]+(?=</version>)')"
          RIP_BUILD_DATE="$(date -u +%Y-%m-%d)"
          sed -i "s/__RIP_VERSION__/${RIP_VERSION}/; s/__RIP_BUILD_DATE__/${RIP_BUILD_DATE}/" target/site/index.html

          cp -r core/target/reports/apidocs target/site/apidocs
          cp -r spring-boot-starter/target/reports/apidocs target/site/spring-boot-starter/apidocs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
