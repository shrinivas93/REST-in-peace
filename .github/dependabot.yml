version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/*.yml current -
  # Dependabot resolves a version bump straight to the new tag's commit SHA,
  # so pinning to a SHA (rather than a floating major-version tag) doesn't
  # trade away update visibility, just the ability for a re-tagged release to
  # silently change what already-reviewed workflow code runs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # core and spring-boot-starter are reactor modules of the root POM (each
  # has <parent>rest-in-peace-parent</parent>, and root lists both under
  # <modules>) - scanning "/" alone resolves the whole reactor's effective
  # POM, so it already sees and can bump dependencies declared in
  # core/pom.xml and spring-boot-starter/pom.xml, not just the root's own.
  # Confirmed empirically: a bump proposed from "/" touched all three
  # pom.xml files in one PR (#175), and a bump proposed from the
  # now-removed "/core" entry independently reached up into the root
  # pom.xml for jacoco-maven-plugin (#173) - the two scans were producing
  # near-duplicate PRs for the same underlying bump. Only the two
  # standalone samples below need their own entries: neither has a
  # <parent> pointing at the root POM nor is listed under root's
  # <modules>, so "/" structurally cannot see them.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-reactor:
        patterns:
          - "*"
    ignore:
      # core targets Java 8 permanently (its whole reason to exist as a
      # separate module from spring-boot-starter), and MockRestServerExtension
      # (main source, not test) implements JUnit Jupiter extension interfaces -
      # making junit-jupiter a compile-scope dependency of core, not
      # test-scope. JUnit 6.x requires Java 17 minimum (junit.org release
      # notes), so any major bump past the 5.x line can never compile under
      # core's real JDK 8 CI job. Without this, Dependabot re-proposes the
      # same broken bump - and since it's grouped with every other maven
      # dependency in this scan, it silently blocks otherwise-safe bumps
      # (gson, maven-compiler-plugin, etc.) from merging cleanly too.
      # Revisit only alongside a deliberate decision to drop core's Java 8
      # support.
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /samples/compile-time-proxy-consumer
    schedule:
      interval: weekly
    groups:
      maven-sample-compile-time-proxy-consumer:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /samples/spring-boot-consumer
    schedule:
      interval: weekly
    groups:
      maven-sample-spring-boot-consumer:
        patterns:
          - "*"
