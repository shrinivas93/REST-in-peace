version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/*.yml current -
  # Dependabot resolves a version bump straight to the new tag's commit SHA,
  # so pinning to a SHA (rather than a floating major-version tag) doesn't
  # trade away update visibility, just the ability for a re-tagged release to
  # silently change what already-reviewed workflow code runs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # One entry per module with its own pom.xml - Dependabot's maven ecosystem
  # doesn't resolve a multi-module reactor from the root POM alone, so the
  # aggregator (/), core, spring-boot-starter, and both standalone samples
  # each need to be scanned separately to see every dependency actually in
  # use anywhere in the repo.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-parent:
        patterns:
          - "*"
    ignore:
      # core (see /core's own ignore rule below for the full reasoning) is
      # permanently locked to Java 8, and this scan resolves the reactor's
      # effective dependencies - including core's - so the same guard is
      # needed here too, or this group re-proposes the same broken bump.
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /core
    schedule:
      interval: weekly
    groups:
      maven-core:
        patterns:
          - "*"
    ignore:
      # core targets Java 8 permanently (its whole reason to exist as a
      # separate module from spring-boot-starter), and MockRestServerExtension
      # (main source, not test) implements JUnit Jupiter extension interfaces -
      # making junit-jupiter a compile-scope dependency here, not test-scope.
      # JUnit 6.x requires Java 17 minimum (junit.org release notes), so any
      # major bump past the 5.x line can never compile under core's real JDK 8
      # CI job. Without this, Dependabot re-proposes the same broken bump - and
      # since it's grouped with every other maven dependency here, it silently
      # blocks otherwise-safe bumps (gson, maven-compiler-plugin, etc.) from
      # merging cleanly too. Revisit only alongside a deliberate decision to
      # drop core's Java 8 support.
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /spring-boot-starter
    schedule:
      interval: weekly
    groups:
      maven-spring-boot-starter:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /samples/compile-time-proxy-consumer
    schedule:
      interval: weekly
    groups:
      maven-sample-compile-time-proxy-consumer:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /samples/spring-boot-consumer
    schedule:
      interval: weekly
    groups:
      maven-sample-spring-boot-consumer:
        patterns:
          - "*"
